<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>~/startpage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=VT323&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%231e1e2e'/><text x='3' y='22' font-family='monospace' font-size='16' fill='%23cba6f7'>%3E</text><text x='16' y='22' font-family='monospace' font-size='16' fill='%23cdd6f4'>_</text></svg>">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <button class="theme-toggle" id="theme-toggle">mocha</button>
    <div class="clock-block">
        <span id="clock"></span>
        <span class="clock-sep">—</span>
        <span id="date-display"></span>
    </div>
    <div class="container">
        <div class="left-container">
            <div class="gif">
                <img src="cat.webp" />
            </div>
        </div>

        <div class="right-container">
            <div class="head">
                <p>&gt; cd ~/<span class="blinking">_</span></p>
            </div>

            <div class="bookmarks">
                <div class="category">
                    <div class="links">
                        <li class="title">mail</li>
                        <li><a href="https://mail.proton.me">proton</a></li>
                        <li><a href="https://app.tuta.com/mail/">tuta</a></li>
                        <li><a href="https://mail.google.com/mail/u/0/#inbox">gmail</a></li>
                    </div>
                </div>

                <div class="category">
                    <div class="links">
                        <li class="title">trashge</li>
                        <li><a href="https://github.com/">github</a></li>
                        <li><a href="https://aur.archlinux.org/packages?SB=l&SO=d">aur</a></li>
                        <li><a href="https://sumi.news">sumi.news</a></li>
                    </div>
                </div>

                <div class="category">
                    <div class="links">
                        <li class="title">social</li>
                        <li><a href="https://bsky.app/">bsky</a></li>
                        <li><a href="https://discord.com/">discord</a></li>
                        <li><a href="https://old.reddit.com/r/all/">reddit</a></li>
                    </div>
                </div>

                <div class="category">
                    <div class="links">
                        <li class="title">play</li>
                        <li><a href="https://www.twitch.tv/directory/following/live">twitch</a></li>
                        <li><a href="https://www.youtube.com/feed/subscriptions">youtube</a></li>
                        <li><a href="https://music.youtube.com/">youtube music</a></li>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function pad(n) { return String(n).padStart(2, '0'); }

        function updateClock() {
            const now = new Date();
            const h = pad(now.getHours());
            const m = pad(now.getMinutes());
            const s = pad(now.getSeconds());
            document.getElementById('clock').textContent = h + ':' + m + ':' + s;

            const days = ['sun','mon','tue','wed','thu','fri','sat'];
            const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
            const dow = days[now.getDay()];
            const day = pad(now.getDate());
            const mon = months[now.getMonth()];
            const yr = now.getFullYear();
            document.getElementById('date-display').textContent = dow + ' ' + day + ' ' + mon + ' ' + yr;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // Mocha accent colors (Catppuccin palette)
        const mochaAccents = [
            { name: 'rosewater', hex: '#f5e0dc' },
            { name: 'flamingo',  hex: '#f2cdcd' },
            { name: 'pink',      hex: '#f5c2e7' },
            { name: 'mauve',     hex: '#cba6f7' },
            { name: 'red',       hex: '#f38ba8' },
            { name: 'maroon',    hex: '#eba0ac' },
            { name: 'peach',     hex: '#fab387' },
            { name: 'yellow',    hex: '#f9e2af' },
            { name: 'green',     hex: '#a6e3a1' },
            { name: 'teal',      hex: '#94e2d5' },
            { name: 'sky',       hex: '#89dceb' },
            { name: 'sapphire',  hex: '#74c7ec' },
            { name: 'blue',      hex: '#89b4fa' },
            { name: 'lavender',  hex: '#b4befe' },
        ];

        const themes = ['dracula', 'mocha'];
        const labels = { dracula: 'mocha', mocha: 'dracula' };
        const toggle = document.getElementById('theme-toggle');

        function pickRandomAccent() {
            const pick = mochaAccents[Math.floor(Math.random() * mochaAccents.length)];
            document.documentElement.style.setProperty('--accent', pick.hex);
        }

        function applyTheme(theme) {
            document.body.classList.remove('dracula', 'mocha');
            document.body.classList.add(theme);
            toggle.textContent = labels[theme];
            localStorage.setItem('theme', theme);
            if (theme === 'mocha') pickRandomAccent();
            else document.documentElement.style.removeProperty('--accent');
        }

        const saved = localStorage.getItem('theme') || 'dracula';
        applyTheme(saved);

        toggle.addEventListener('click', () => {
            const current = localStorage.getItem('theme') || 'dracula';
            const next = themes[(themes.indexOf(current) + 1) % themes.length];
            applyTheme(next);
        });
    </script>
</body>

</html>
