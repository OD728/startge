<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>~/startpage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%2306070f'/><text x='3' y='22' font-family='monospace' font-size='16' fill='%235fb4c4'>%3E</text><text x='16' y='22' font-family='monospace' font-size='16' fill='%23b8567e'>_</text></svg>">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body class="rain">
    <button class="theme-toggle" id="theme-toggle">2049</button>
    <div class="clock-block">
        <span id="clock"></span>
        <span class="clock-sep">//</span>
        <span id="date-display"></span>
    </div>
    <div class="container">
        <div class="left-container">
            <div class="gif">
                <img src="cyber002.webp" alt="" />
            </div>
        </div>

        <div class="right-container">
            <div class="head">
                <p>&gt; cd ~/<span class="blinking">_</span></p>
            </div>

            <div class="bookmarks">
                <div class="category">
                    <div class="links">
                        <li class="title">mail</li>
                        <li><a href="https://app.tuta.com/mail/">tuta</a></li>
                        <li><a href="https://mail.google.com/mail/u/0/#inbox">gmail</a></li>
                        <li><a href="https://mail.proton.me">proton</a></li>
                    </div>
                </div>

                <div class="category">
                    <div class="links">
                        <li class="title">trashge</li>

                        <li><a href="https://github.com/">github</a></li>
                        <li><a href="https://patreon.com/feed/membership">patreon</a></li>
                        
                    </div>
                </div>

                <div class="category">
                    <div class="links">
                        <li class="title">social</li>
                        <li><a href="https://bsky.app/">bsky</a></li>
                        <li><a href="https://old.reddit.com/r/all/">reddit</a></li>
                        <li><a href="https://discord.com/">discord</a></li>
                    </div>
                </div>

                <div class="category">
                    <div class="links">
                        <li class="title">media</li>
                        <li><a href="https://www.twitch.tv/directory/following/live">twitch</a></li>
                        <li><a href="https://music.youtube.com/">ytmusic</a></li>
                        <li><a href="https://www.youtube.com/feed/subscriptions">youtube</a></li>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function pad(n) { return String(n).padStart(2, '0'); }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

            const days = ['sun','mon','tue','wed','thu','fri','sat'];
            const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
            document.getElementById('date-display').textContent =
                days[now.getDay()] + ' ' + pad(now.getDate()) + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
        }

        updateClock();
        setInterval(updateClock, 1000);

        // rain = 2019 (cyan/magenta neon), haze = 2049 (sodium orange)
        const themes = ['rain', 'haze'];
        const labels = { rain: '2049', haze: '2019' }; // button shows the theme you'll switch to
        const toggle = document.getElementById('theme-toggle');

        function getSaved() {
            try {
                const t = localStorage.getItem('theme');
                return themes.includes(t) ? t : 'rain';
            } catch (e) { return 'rain'; }
        }

        function applyTheme(theme) {
            document.body.classList.remove(...themes);
            document.body.classList.add(theme);
            toggle.textContent = labels[theme];
            try { localStorage.setItem('theme', theme); } catch (e) {}
        }

        applyTheme(getSaved());

        toggle.addEventListener('click', () => {
            const next = themes[(themes.indexOf(getSaved()) + 1) % themes.length];
            applyTheme(next);
        });
    </script>
</body>

</html>
