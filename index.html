<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>~/startpage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%2306070f'/><text x='3' y='22' font-family='monospace' font-size='16' fill='%235fb4c4'>%3E</text><text x='16' y='22' font-family='monospace' font-size='16' fill='%23b8567e'>_</text></svg>">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body class="vice instant">
    <canvas id="bgfx"></canvas>
    <div class="tag">tyrell terminal 07</div>
    <div class="toggles">
        <div class="switch" role="radiogroup" aria-label="theme">
            <span class="knob"></span>
            <button role="radio" data-theme="vice">vi</button>
            <button role="radio" data-theme="rain">2019</button>
            <button role="radio" data-theme="dracula">dracula</button>
        </div>
    </div>
    <div class="clock-block">
        <span id="clock"></span>
        <span class="clock-sep">//</span>
        <span id="date-display"></span>
    </div>
    <div class="container">
        <div class="left-container">
            <div class="gif">
                <img src="cyber002.webp" alt="" />
            </div>
        </div>

        <div class="right-container">
            <div class="head">
                <p>&gt; cd ~/<span class="blinking">_</span></p>
            </div>

            <div class="bookmarks">
                <div class="category">
                    <div class="links">
                        <li class="title">mail</li>
                        <li><a href="https://app.tuta.com/mail/">tuta</a></li>
                        <li><a href="https://mail.google.com/mail/u/0/#inbox">gmail</a></li>
                        <li><a href="https://mail.proton.me">proton</a></li>
                    </div>
                </div>

                <div class="category">
                    <div class="links">
                        <li class="title">trashge</li>
                        <li><a href="https://github.com/">github</a></li>
                        <li><a href="https://patreon.com/feed/membership">patreon</a></li>
                        
                    </div>
                </div>

                <div class="category">
                    <div class="links">
                        <li class="title">social</li>
                        <li><a href="https://bsky.app/">bsky</a></li>
                        <li><a href="https://old.reddit.com/r/all/">reddit</a></li>
                        <li><a href="https://discord.com/">discord</a></li>
                    </div>
                </div>

                <div class="category">
                    <div class="links">
                        <li class="title">media</li>
                        <li><a href="https://www.twitch.tv/directory/following/live">twitch</a></li>
                        <li><a href="https://music.youtube.com/">ytmusic</a></li>
                        <li><a href="https://www.youtube.com/feed/subscriptions">youtube</a></li>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function pad(n) { return String(n).padStart(2, '0'); }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

            const days = ['sun','mon','tue','wed','thu','fri','sat'];
            const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
            document.getElementById('date-display').textContent =
                days[now.getDay()] + ' ' + pad(now.getDate()) + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
        }

        updateClock();
        setInterval(updateClock, 1000);

        // vice = gta 6 (blue/pink/orange sunset), rain = 2019 (cyan/magenta neon), dracula = dracula colour scheme (purple/pink)
        const themes = ['vice', 'rain', 'dracula'];
        const stops = document.querySelectorAll('.switch button');

        function getSaved() {
            try {
                const t = localStorage.getItem('theme');
                return themes.includes(t) ? t : 'vice';
            } catch (e) { return 'vice'; }
        }

        function applyTheme(theme) {
            document.body.classList.remove(...themes);
            document.body.classList.add(theme);
            stops.forEach(b => b.setAttribute('aria-checked', b.dataset.theme === theme));
            try { localStorage.setItem('theme', theme); } catch (e) {}
        }

        applyTheme(getSaved());

        stops.forEach(b => b.addEventListener('click', () => applyTheme(b.dataset.theme)));

        // saved theme shows on load without fading in
        requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('instant')));

        const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

        // magnetic links: a bookmark leans toward the cursor while it is near
        if (!calm) {
            document.querySelectorAll('.links a').forEach(a => {
                const reach = 40;
                document.addEventListener('pointermove', e => {
                    const r = a.getBoundingClientRect();
                    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
                    const near = e.clientX > r.left - reach && e.clientX < r.right + reach &&
                                 e.clientY > r.top - 4 && e.clientY < r.bottom + 4;
                    if (near) {
                        a.classList.add('pull');
                        a.style.transform = `translate(${(e.clientX - cx) * 0.25}px, ${(e.clientY - cy) * 0.35}px)`;
                    } else if (a.classList.contains('pull')) {
                        a.classList.remove('pull');
                        a.style.transform = '';
                    }
                });
            });
        }

        // background: dot grid that ripples around the cursor
        const cv = document.getElementById('bgfx');
        const cx = cv.getContext('2d');
        const css = n => getComputedStyle(document.body).getPropertyValue(n).trim();
        let W, H, mouse = { x: -999, y: -999 };

        function size() {
            const dpr = Math.min(devicePixelRatio || 1, 2);
            W = innerWidth; H = innerHeight;
            cv.width = W * dpr; cv.height = H * dpr;
            cx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function grid(t) {
            cx.clearRect(0, 0, W, H);
            const gap = 16, reach = 130, dim = css('--link'), acc = css('--accent');
            for (let x = gap / 2; x < W; x += gap) {
                for (let y = gap / 2; y < H; y += gap) {
                    const dx = x - mouse.x, dy = y - mouse.y, d = Math.hypot(dx, dy);
                    const k = Math.max(0, 1 - d / reach);
                    const wave = Math.sin(t / 900 + x / 90 + y / 140) * 0.5 + 0.5;
                    const px = x + (d ? dx / d : 0) * k * 6, py = y + (d ? dy / d : 0) * k * 6;
                    if (k <= 0) continue;
                    cx.globalAlpha = k * (0.55 + wave * 0.3);
                    cx.fillStyle = acc;
                    cx.beginPath();
                    cx.arc(px, py, 0.8 + k * 1.2, 0, 7);
                    cx.fill();
                }
            }
            cx.globalAlpha = 1;
        }

        function frame(t) {
            requestAnimationFrame(frame);
            if (!document.hidden) grid(t);
        }

        addEventListener('resize', size);
        addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        document.documentElement.addEventListener('pointerleave', () => { mouse.x = mouse.y = -999; });
        size();
        if (calm) grid(0); else requestAnimationFrame(frame);
    </script>
</body>

</html>
